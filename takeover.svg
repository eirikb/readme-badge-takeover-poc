<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Badge takeover proof of concept">
  <title>Badge takeover proof of concept</title>
  <desc>Demonstrates that a remotely hosted README badge can be replaced with arbitrary full-width animated content, without any change to the repository.</desc>

  <defs>
    <clipPath id="card"><rect width="880" height="420" rx="12"/></clipPath>
    <clipPath id="mq"><rect x="0" y="344" width="880" height="36"/></clipPath>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ff7a18" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a18" stop-opacity="0.30"/>
      <stop offset="1"   stop-color="#ff7a18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <style>
    .f{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .pulse{animation:p 1.1s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.12}}
    .glow{animation:g 3s ease-in-out infinite}
    @keyframes g{0%,100%{opacity:.55}50%{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="420" fill="#0b0f14"/>

    <g opacity="0.55">
      <path d="M0 250 H880 M0 300 H880 M0 200 H880" stroke="#16202b" stroke-width="1"/>
      <path d="M220 0 V420 M440 0 V420 M660 0 V420" stroke="#16202b" stroke-width="1"/>
    </g>

    <g>
      <rect x="-460" y="0" width="300" height="420" fill="url(#sweep)" transform="skewX(-18)">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="1320 0"
                          dur="4.6s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>

    <rect x="0" y="0" width="880" height="40" fill="#1a1109"/>
    <circle cx="26" cy="20" r="6" fill="#ff4d4d" class="pulse"/>
    <text x="46" y="25" class="m" font-size="13" fill="#ffb37a" letter-spacing="1.2">REMOTE CONTENT — SERVED BY THE BADGE HOST, NOT BY THIS REPOSITORY</text>

    <text x="44" y="122" class="f" font-size="47" font-weight="800" fill="#ffffff">THIS WAS A 132×20 BADGE</text>
    <text x="46" y="160" class="f" font-size="21" fill="#8fa1b3">…until the host decided to serve something else at the same URL.</text>

    <g transform="translate(46,192)">
      <g>
        <clipPath id="rb"><rect width="132" height="20" rx="4"/></clipPath>
        <g clip-path="url(#rb)">
          <rect width="85" height="20" fill="#1f2937"/>
          <rect x="85" width="47" height="20" fill="#2f9e44"/>
          <rect width="132" height="20" fill="url(#shine)"/>
        </g>
        <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
          <text x="43" y="14">directory</text><text x="108" y="14">indexed</text>
        </g>
      </g>
      <text x="146" y="15" class="m" font-size="13" fill="#5f7183">← what you reviewed, at actual size</text>
    </g>

    <g class="m" font-size="15" fill="#c9d6e2">
      <text x="46" y="256">same markdown   ·   same commit   ·   same URL   ·   zero repo changes</text>
      <text x="46" y="284" fill="#ffb37a">cache-control: max-age=300   →   a swap reaches every reader in 5 minutes</text>
      <text x="46" y="312" fill="#8fa1b3">no SRI   ·   no version pinning   ·   no review step   ·   no script required</text>
    </g>

    <rect x="0" y="344" width="880" height="36" fill="#12181f"/>
    <g clip-path="url(#mq)">
      <g class="m" font-size="14" fill="#ff9a4d">
        <animateTransform attributeName="transform" type="translate" from="880 0" to="-980 0"
                          dur="13s" repeatCount="indefinite"/>
        <text x="0" y="367">arbitrary text · animation · full-width artwork · embedded images · restyled any time · pointed anywhere · and the commit still just says "add badge" ·&#160;&#160;&#160;</text>
        <text x="980" y="367">arbitrary text · animation · full-width artwork · embedded images · restyled any time · pointed anywhere · and the commit still just says "add badge" ·&#160;&#160;&#160;</text>
      </g>
    </g>

    <text x="46" y="404" class="m glow" font-size="12" fill="#4c5c6b">proof of concept · no script, no network calls, no tracking — this file is only pixels</text>

    <rect x="0.5" y="0.5" width="879" height="419" rx="12" fill="none" stroke="#ff7a18" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>
</svg>
