<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" role="img" aria-label="Installation">
  <title>Installation</title>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font-weight:600}
    .body{font-size:16px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.6px;fill:#1f2328}
    .lnk{fill:#0969da}
    .hb{stroke:#d1d9e0}
    .cb{fill:#f6f8fa;stroke:#d0d7de}
    @media (prefers-color-scheme:dark){
      text{fill:#e6edf3}
      .code{fill:#e6edf3}
      .lnk{fill:#2f81f7}
      .hb{stroke:#30363d}
      .cb{fill:#161b22;stroke:#30363d}
    }
  </style>

  <text class="h" x="0" y="23" font-size="24">Installation</text>
  <line class="hb" x1="0" y1="34" x2="880" y2="34" stroke-width="1"/>

  <text class="body" x="0" y="64">Install the latest release from the registry:</text>

  <rect class="cb" x="0" y="80" width="880" height="46" rx="6" stroke-width="1"/>
  <text class="code" x="16" y="108">npm install awesome-project@latest</text>

  <text class="body" x="0" y="162">Read the <tspan class="lnk">documentation</tspan> or browse the <tspan class="lnk">examples</tspan> to get started.</text>
</svg>
